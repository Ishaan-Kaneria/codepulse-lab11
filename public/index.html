<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodePulse</title>
  <meta name="description" content="CodePulse: a LeetCode-style practice platform running on PostgreSQL. Team 25, MC212 Database Management Systems.">
  <meta name="theme-color" content="#0F1A2E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230F1A2E'/%3E%3Crect x='7' y='9' width='3' height='14' rx='1.5' fill='%231C9E6B'/%3E%3Crect x='12.5' y='13' width='3' height='10' rx='1.5' fill='%23E04848'/%3E%3Crect x='18' y='7' width='3' height='16' rx='1.5' fill='%231C9E6B'/%3E%3Crect x='23.5' y='15' width='3' height='8' rx='1.5' fill='%23E9A23B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <div class="app">
    <aside class="rail" id="sidebar" aria-label="Screens">
      <a class="brand" href="#/overview" aria-label="CodePulse home">
        <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true">
          <rect width="32" height="32" rx="9" class="bm-bg"/>
          <rect x="7" y="9" width="3" height="14" rx="1.5" class="bm-ac"/>
          <rect x="12.5" y="13" width="3" height="10" rx="1.5" class="bm-wa"/>
          <rect x="18" y="7" width="3" height="16" rx="1.5" class="bm-ac"/>
          <rect x="23.5" y="15" width="3" height="8" rx="1.5" class="bm-tle"/>
        </svg>
        <span class="brand-name">CodePulse</span>
      </a>
      <nav id="nav"></nav>
      <div class="rail-foot">
        <div class="conn" id="conn"><span class="dot" aria-hidden="true"></span><span id="conn-text">Connecting to PostgreSQL</span></div>
        <div class="team">Team 25, MC212 DBMS<br>Ishaan Kaneria and Mann Chauhan</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="jump" id="jump-btn" aria-label="Jump to a screen or problem">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span>Jump to a screen or problem</span>
          <kbd id="jump-kbd">Ctrl K</kbd>
        </button>
        <div class="top-actions">
          <span class="asof" title="The sample data runs up to this date">Data up to 17 Oct 2026</span>
          <button class="icon-btn" id="theme-btn" aria-label="Switch between light and dark" title="Light or dark">
            <svg viewBox="0 0 24 24" class="i-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
    <div class="drawer-head"><h3 id="drawer-title"></h3><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="drawer-head"><h3 id="modal-title"></h3><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <div class="palette" id="palette" aria-hidden="true" role="dialog" aria-label="Jump to">
    <div class="palette-card">
      <div class="palette-input">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="palette-q" placeholder="Type a screen, a problem title or a problem id" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="palette-list" id="palette-list" role="listbox"></div>
    </div>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
